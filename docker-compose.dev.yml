name: hackspain-dev

services:
  backend:
    build:
      context: ./backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8766", "--reload", "--reload-dir", "/app", "--reload-delay", "0.1", "--reload-include", "*", "--reload-exclude", "data", "--reload-exclude", "logs"]
    env_file:
      - backend/.env
    environment:
      ENV: development
      TZ: Europe/Madrid
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - Dockerfile
            - requirements.txt
            - data/
            - .venv/
            - .env
            - logs/
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./backend/requirements.txt

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "documents.worker"]
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      ENV: development
      TZ: Europe/Madrid
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          initial_sync: true
          ignore: [Dockerfile, requirements.txt, data/, .venv/, .env, logs/, __pycache__/]
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://backend:8766
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - Dockerfile.dev
            - bun.lock
            - package.json
            - node_modules/
            - dist/
        - action: rebuild
          path: ./frontend/Dockerfile.dev
        - action: rebuild
          path: ./frontend/bun.lock
        - action: rebuild
          path: ./frontend/package.json

volumes:
  redis_data:
