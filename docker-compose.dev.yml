name: hackspain-dev

services:
  erp:
    build:
      context: ./infra/erp
    init: true
    restart: unless-stopped
    volumes:
      - ./500-sombras-de-alberto:/challenge:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/erp/estado', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8766", "--reload", "--reload-dir", "/app", "--reload-delay", "0.1", "--reload-include", "*", "--reload-exclude", "data", "--reload-exclude", "logs"]
    env_file:
      - backend/.env
    environment:
      ENV: development
      TZ: Europe/Madrid
      ERP_BASE_URL: http://erp:8009
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8766:8766"
    depends_on:
      erp:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - Dockerfile
            - requirements.txt
            - data/
            - .venv/
            - .env
            - logs/
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./backend/requirements.txt

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "invoices.worker"]
    stop_grace_period: 240s
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      ENV: development
      TZ: Europe/Madrid
      ERP_BASE_URL: http://erp:8009
      REDIS_URL: redis://redis:6379/0
      INVOICE_WORKERS: "5"
    depends_on:
      erp:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore: [Dockerfile, requirements.txt, data/, .venv/, .env, logs/, __pycache__/]
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:8766
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - Dockerfile.dev
            - bun.lock
            - package.json
            - node_modules/
            - dist/
        - action: rebuild
          path: ./frontend/Dockerfile.dev
        - action: rebuild
          path: ./frontend/bun.lock
        - action: rebuild
          path: ./frontend/package.json

volumes:
  redis_data:
